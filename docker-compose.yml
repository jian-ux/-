services:
  mysql:
    image: mysql:8.4
    container_name: feisheng-mysql
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_DATABASE: feisheng_bot_db
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./feisheng-bot-parent/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  minio:
    image: minio/minio:latest
    container_name: feisheng-minio
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  minio-init:
    image: minio/mc:latest
    container_name: feisheng-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -ec "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY} ${MINIO_SECRET_KEY} &&
      mc mb --ignore-existing local/${MINIO_BUCKET:-feisheng-docs} &&
      echo 'Bucket ${MINIO_BUCKET:-feisheng-docs} ready'
      "

  redis:
    image: redis:7-alpine
    container_name: feisheng-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.14.1
    container_name: feisheng-qdrant
    ports:
      - "127.0.0.1:${QDRANT_HOST_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  reranker:
    build:
      context: ./services/qwen3-vl-reranker
    container_name: feisheng-reranker
    gpus: all
    shm_size: "1gb"
    ports:
      - "127.0.0.1:${RERANK_HOST_PORT:-8091}:8091"
    environment:
      HF_HOME: /models/huggingface
      SENTENCE_TRANSFORMERS_HOME: /models/huggingface
      HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
      HF_HUB_DISABLE_XET: "1"
      HF_TOKEN: ${HF_TOKEN:-}
      TORCH_HOME: /models/torch
      RERANK_API_KEY: ${RERANK_API_KEY:?RERANK_API_KEY is required}
      RERANK_MODEL: ${RERANK_MODEL:-Qwen/Qwen3-Reranker-0.6B}
      RERANK_DEVICE: cuda
      RERANK_DTYPE: bfloat16
      RERANK_MAX_CANDIDATES: ${RAG_RERANK_MAX_CANDIDATES:-10}
      RERANK_MAX_LENGTH: ${RERANK_MAX_LENGTH:-1024}
      RERANK_BATCH_SIZE: ${RERANK_BATCH_SIZE:-8}
      RERANK_CACHE_MAX_ENTRIES: ${RERANK_CACHE_MAX_ENTRIES:-1024}
      RERANK_SCORE_TEMPERATURE: ${RERANK_SCORE_TEMPERATURE:-1.0}
    volumes:
      - reranker_model_cache:/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8091/health', timeout=3)); raise SystemExit(0 if data.get('status') == 'ok' else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20m

  app:
    build: .
    container_name: feisheng-bot
    ports:
      - "8082:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      reranker:
        condition: service_started
    environment:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8 -Dsun.stdout.encoding=UTF-8 -Dsun.stderr.encoding=UTF-8
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/feisheng_bot_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-}
      KNOWLEDGE_IMAGE_URL_TTL_SECONDS: ${KNOWLEDGE_IMAGE_URL_TTL_SECONDS:-3600}
