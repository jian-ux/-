server:
  port: 8082
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: feisheng-bot-core
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/feisheng_bot_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}
      database: 0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

customer-service:
  tools-enabled: ${CUSTOMER_SERVICE_TOOLS_ENABLED:false}
  intent-static-replies-enabled: ${CUSTOMER_SERVICE_INTENT_STATIC_REPLIES_ENABLED:false}
  intent-understanding:
    enabled: ${CUSTOMER_SERVICE_INTENT_UNDERSTANDING_ENABLED:true}
    eager-enabled: ${CUSTOMER_SERVICE_INTENT_UNDERSTANDING_EAGER_ENABLED:false}
    min-confidence: ${CUSTOMER_SERVICE_INTENT_UNDERSTANDING_MIN_CONFIDENCE:0.75}
    max-history-messages: ${CUSTOMER_SERVICE_INTENT_UNDERSTANDING_MAX_HISTORY_MESSAGES:4}
    model-id: ${CUSTOMER_SERVICE_INTENT_MODEL_ID:0}
  flash-model-id: ${CUSTOMER_SERVICE_FLASH_MODEL_ID:0}
  flash-max-question-chars: ${CUSTOMER_SERVICE_FLASH_MAX_QUESTION_CHARS:80}

rag:
  embedding:
    cache-ttl-seconds: ${RAG_EMBEDDING_CACHE_TTL_SECONDS:86400}
    local-cache-max-entries: ${RAG_EMBEDDING_LOCAL_CACHE_MAX_ENTRIES:512}
  context:
    max-history-messages: ${RAG_CONTEXT_MAX_HISTORY_MESSAGES:6}
    max-retrieval-history-messages: ${RAG_CONTEXT_MAX_RETRIEVAL_HISTORY_MESSAGES:4}
    max-retrieval-history-chars: ${RAG_CONTEXT_MAX_RETRIEVAL_HISTORY_CHARS:1200}
    max-prompt-tokens: ${RAG_CONTEXT_MAX_PROMPT_TOKENS:4000}
    summary:
      enabled: ${RAG_CONTEXT_SUMMARY_ENABLED:true}
      trigger-ratio: ${RAG_CONTEXT_SUMMARY_TRIGGER_RATIO:0.80}
      target-ratio: ${RAG_CONTEXT_SUMMARY_TARGET_RATIO:0.50}
      keep-messages: ${RAG_CONTEXT_SUMMARY_KEEP_MESSAGES:4}
      max-chars: ${RAG_CONTEXT_SUMMARY_MAX_CHARS:4000}
      model-id: ${RAG_CONTEXT_SUMMARY_MODEL_ID:0}
  profile-extraction:
    enabled: ${RAG_PROFILE_EXTRACTION_ENABLED:true}
    model-id: ${RAG_PROFILE_EXTRACTION_MODEL_ID:0}
  retrieval:
    pipeline-version: ${RAG_PIPELINE_VERSION:rag-corrective-evidence-v2}
    top-k: ${RAG_TOP_K:3}
    candidate-k: ${RAG_CANDIDATE_K:6}
    direct-threshold: ${RAG_DIRECT_THRESHOLD:0.82}
    context-threshold: ${RAG_CONTEXT_THRESHOLD:0.50}
    lexical-threshold: ${RAG_LEXICAL_THRESHOLD:0.72}
    bm25-enabled: ${RAG_BM25_ENABLED:true}
    bm25-min-score: ${RAG_BM25_MIN_SCORE:0.0}
    bm25-fallback-min-score: ${RAG_BM25_FALLBACK_MIN_SCORE:8.0}
    bm25-fallback-min-gap-ratio: ${RAG_BM25_FALLBACK_MIN_GAP_RATIO:1.10}
    bm25-fallback-min-question-similarity: ${RAG_BM25_FALLBACK_MIN_QUESTION_SIMILARITY:0.60}
    bm25-fallback-confidence: ${RAG_BM25_FALLBACK_CONFIDENCE:0.65}
    rank-fusion-k: ${RAG_RANK_FUSION_K:60}
    neighbor-radius: ${RAG_NEIGHBOR_RADIUS:1}
    max-neighbor-chunks: ${RAG_MAX_NEIGHBOR_CHUNKS:4}
  query-expansion:
    enabled: ${RAG_QUERY_EXPANSION_ENABLED:false}
    max-variants: ${RAG_QUERY_EXPANSION_MAX_VARIANTS:5}
    max-query-chars: ${RAG_QUERY_EXPANSION_MAX_QUERY_CHARS:160}
  structured-unit-index:
    # Disabled by default. Shadow mode records candidate-only diagnostics and
    # never changes evidence ranking, reranking, citations, context, or answers.
    enabled: ${RAG_STRUCTURED_UNIT_INDEX_ENABLED:false}
    shadow-only: ${RAG_STRUCTURED_UNIT_INDEX_SHADOW_ONLY:true}
    top-k: ${RAG_STRUCTURED_UNIT_INDEX_TOP_K:5}
    # Applied to semantic-unit scores before resolved evidence chunks enter fusion.
    weight: ${RAG_STRUCTURED_UNIT_INDEX_WEIGHT:0.65}
  rerank:
    enabled: ${RAG_RERANK_ENABLED:false}
    url: ${RAG_RERANK_URL:http://reranker:8091/rerank}
    api-key: ${RAG_RERANK_API_KEY:}
    model: ${RAG_RERANK_MODEL:Qwen/Qwen3-Reranker-0.6B}
    connect-timeout-ms: ${RAG_RERANK_CONNECT_TIMEOUT_MS:1000}
    read-timeout-ms: ${RAG_RERANK_READ_TIMEOUT_MS:15000}
    max-candidates: ${RAG_RERANK_MAX_CANDIDATES:6}
    max-document-chars: ${RAG_RERANK_MAX_DOCUMENT_CHARS:1200}
    # Applied only after a complete rerank response. Both the absolute score and
    # the top1/top2 gap must pass the tier thresholds; calibrate them per model.
    confidence:
      high-min-score: ${RAG_RERANK_HIGH_MIN_SCORE:0.65}
      high-min-gap: ${RAG_RERANK_HIGH_MIN_GAP:0.08}
      medium-min-score: ${RAG_RERANK_MEDIUM_MIN_SCORE:0.40}
      medium-min-gap: ${RAG_RERANK_MEDIUM_MIN_GAP:-0.10}
  structured-qa:
    enabled: ${RAG_STRUCTURED_QA_ENABLED:true}
    exact-min-score: ${RAG_STRUCTURED_QA_EXACT_MIN_SCORE:0.82}
    rerank-min-score: ${RAG_STRUCTURED_QA_RERANK_MIN_SCORE:0.65}
    rerank-min-gap: ${RAG_STRUCTURED_QA_RERANK_MIN_GAP:0.08}
    answer-fallback:
      enabled: ${RAG_STRUCTURED_QA_ANSWER_FALLBACK_ENABLED:true}
      lexical-min-score: ${RAG_STRUCTURED_QA_ANSWER_FALLBACK_LEXICAL_MIN_SCORE:0.98}
      confidence: ${RAG_STRUCTURED_QA_ANSWER_FALLBACK_CONFIDENCE:0.65}
  no-answer:
    reply: ${RAG_NO_ANSWER_REPLY:这个问题我暂时无法准确确认。请补充具体的产品、功能或使用场景，我会继续为您核实。}
    transfer: ${RAG_NO_ANSWER_TRANSFER:false}
  unrelated:
    reply: ${RAG_UNRELATED_REPLY:这个问题不属于点签电子合同业务服务范围。您可以继续咨询点签产品、合同签署或使用操作相关问题。}
  error:
    reply: ${RAG_ERROR_REPLY:当前查询出现异常，暂时无法完成回答，请稍后重试。}
  handoff:
    low-confidence-threshold: ${RAG_HANDOFF_LOW_CONFIDENCE_THRESHOLD:0.55}
    price-keywords: ${RAG_HANDOFF_PRICE_KEYWORDS:定制报价,专属报价,商务报价,最终报价,折扣,优惠,议价,最低价,底价,便宜点,打折}
    price-reply: ${RAG_HANDOFF_PRICE_REPLY:您咨询的是价格相关信息。价格、报价和优惠需要由客服根据实际情况确认，已为您提交人工核实。您可以继续补充套餐类型或使用人数，我会一并同步。}
    price-failed-reply: ${RAG_HANDOFF_PRICE_FAILED_REPLY:价格、报价和优惠需要由客服确认，但当前未能成功提交人工请求。请稍后重试或联系人工客服。}
  answerability-gate:
    min-model-confidence: ${RAG_ANSWERABILITY_GATE_MIN_MODEL_CONFIDENCE:0.40}
  bad-case:
    slow-response-ms: ${RAG_BAD_CASE_SLOW_RESPONSE_MS:5000}
  native-fallback:
    enabled: ${RAG_NATIVE_FALLBACK_ENABLED:false}
    high-risk-keywords: ${RAG_NATIVE_FALLBACK_HIGH_RISK_KEYWORDS:合同条款,法律效力,违约责任,赔偿责任,合规承诺,保证结果,隐私泄露,个人信息泄露}
    clarification-keywords: ${RAG_NATIVE_FALLBACK_CLARIFICATION_KEYWORDS:这个,那个,它,这款,那款,然后呢}
    clarification-reply: ${RAG_NATIVE_FALLBACK_CLARIFICATION_REPLY:您好，为了准确帮您处理，请补充要咨询的产品、功能或具体使用场景；}
    high-risk-reply: ${RAG_NATIVE_FALLBACK_HIGH_RISK_REPLY:您好，涉及产品能力、价格、合同、交付或售后等业务信息，需要以可核实资料为准，需要由人工客服进一步确认。}
    high-risk-transfer: ${RAG_NATIVE_FALLBACK_HIGH_RISK_TRANSFER:true}
  out-of-scope:
    keywords: ${RAG_OUT_OF_SCOPE_KEYWORDS:CA锁,实体锁,UKey,U-Key,安全控件,守信签,总部电子签章,翔晟电子签章}
    reply: |-
      您好，非常抱歉，我们这边主要是做互联网电子合同业务的，不属于此项业务板块，建议您通过以下途径解决：
      ① （推荐）添加QQ在线服务群，联系在线客服答疑QQ群：
      一群：575467556
      二群：769414652
      三群：856201972
      四群：795382083
      五群：518585994
      六群：745732151
      七群：746835832
      八群：786045605
      九群：612640416
      进入【江苏翔晟服务群】咨询在线客服。
      ② 进入翔晟官网自助查询及办理
      官网链接：http://www.share-sun.com.cn/index.php/zxfw/
      ③ 拨打客服热线电话：025-66085508。

ai:
  customer-service:
    prompt-version: ${AI_CUSTOMER_SERVICE_PROMPT_VERSION:v2}
    system-prompt-v1: ${AI_CUSTOMER_SERVICE_SYSTEM_PROMPT_V1:}
    system-prompt-v2: ${AI_CUSTOMER_SERVICE_SYSTEM_PROMPT_V2:}
    native-fallback-system-prompt: ${AI_NATIVE_FALLBACK_SYSTEM_PROMPT:}
  embedding:
    connect-timeout-ms: ${AI_EMBEDDING_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${AI_EMBEDDING_READ_TIMEOUT_MS:5000}
  llm:
    connect-timeout: ${AI_LLM_CONNECT_TIMEOUT_MS:10000}
    read-timeout: ${AI_LLM_READ_TIMEOUT_MS:60000}
    max-retries: ${AI_LLM_MAX_RETRIES:1}
    temperature: ${AI_LLM_TEMPERATURE:0.0}
    max-output-tokens: ${AI_LLM_MAX_OUTPUT_TOKENS:1024}
    deepseek-thinking-enabled: ${AI_LLM_DEEPSEEK_THINKING_ENABLED:false}
    local:
      warmup-enabled: ${AI_LLM_LOCAL_WARMUP_ENABLED:true}
      keep-alive: ${AI_LLM_LOCAL_KEEP_ALIVE:-1}
speech:
  synthesis:
    enabled: ${TTS_ENABLED:false}
    api-url: ${TTS_API_URL:https://api.openai.com/v1/audio/speech}
    api-key: ${TTS_API_KEY:}
    model: ${TTS_MODEL:tts-1}
    voice: ${TTS_VOICE:alloy}
    response-format: ${TTS_RESPONSE_FORMAT:mp3}
    speed: ${TTS_SPEED:1.0}
    max-input-chars: ${TTS_MAX_INPUT_CHARS:2000}
    max-bytes: ${TTS_MAX_BYTES:10485760}
    connect-timeout-seconds: ${TTS_CONNECT_TIMEOUT_SECONDS:10}
    timeout-seconds: ${TTS_TIMEOUT_SECONDS:120}

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
    instances:
      aiModel:
        base-config: default
      knowledgeClient:
        base-config: default
