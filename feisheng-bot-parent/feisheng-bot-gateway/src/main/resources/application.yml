server:
  port: 8081
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: feisheng-bot-gateway
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/feisheng_bot_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}
      database: 0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

dingtalk:
  app-secret: ${DINGTALK_APP_SECRET:}
  token: ${DINGTALK_TOKEN:}
  encoding-aes-key: ${DINGTALK_ENCODING_AES_KEY:}
  robot-code: ${DINGTALK_ROBOT_CODE:}
  stream:
    enabled: ${DINGTALK_STREAM_ENABLED:false}
    client-id: ${DINGTALK_CLIENT_ID:}
    client-secret: ${DINGTALK_CLIENT_SECRET:}
    consume-threads: ${DINGTALK_STREAM_CONSUME_THREADS:4}
    processing-worker-threads: ${DINGTALK_STREAM_PROCESSING_WORKER_THREADS:4}
    processing-queue-capacity: ${DINGTALK_STREAM_PROCESSING_QUEUE_CAPACITY:100}
    complex-ack-enabled: ${DINGTALK_STREAM_COMPLEX_ACK_ENABLED:true}
    complex-ack-min-chars: ${DINGTALK_STREAM_COMPLEX_ACK_MIN_CHARS:60}
  media:
    worker-threads: ${DINGTALK_MEDIA_WORKER_THREADS:2}
    queue-capacity: ${DINGTALK_MEDIA_QUEUE_CAPACITY:50}
    connect-timeout-ms: ${DINGTALK_MEDIA_CONNECT_TIMEOUT_MS:10000}
    read-timeout-ms: ${DINGTALK_MEDIA_READ_TIMEOUT_MS:30000}
    max-image-bytes: ${DINGTALK_MEDIA_MAX_IMAGE_BYTES:10485760}
    max-audio-bytes: ${DINGTALK_MEDIA_MAX_AUDIO_BYTES:26214400}
    max-text-chars: ${DINGTALK_MEDIA_MAX_TEXT_CHARS:8000}
    ffmpeg-command: ${DINGTALK_MEDIA_FFMPEG_COMMAND:ffmpeg}
    ffmpeg-timeout-seconds: ${DINGTALK_MEDIA_FFMPEG_TIMEOUT_SECONDS:60}
wecom:
  corp-id: ${WECOM_CORP_ID:}
  corp-secret: ${WECOM_CORP_SECRET:}
  agent-id: ${WECOM_AGENT_ID:}
  callback-token: ${WECOM_CALLBACK_TOKEN:}
  callback-aes-key: ${WECOM_CALLBACK_AES_KEY:}
  api-base: ${WECOM_API_BASE:https://qyapi.weixin.qq.com}
web:
  async:
    worker-threads: ${WEB_ASYNC_WORKER_THREADS:4}
    queue-capacity: ${WEB_ASYNC_QUEUE_CAPACITY:100}
    result-ttl-seconds: ${WEB_ASYNC_RESULT_TTL_SECONDS:600}
    max-jobs: ${WEB_ASYNC_MAX_JOBS:1000}
