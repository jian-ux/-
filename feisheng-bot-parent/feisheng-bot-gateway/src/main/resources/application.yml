server:
  port: 8081

spring:
  application:
    name: feisheng-bot-gateway
  datasource:
    url: jdbc:mysql://localhost:3306/feisheng_bot_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      database: 0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

dingtalk:
  app-secret: ${DINGTALK_APP_SECRET:}
